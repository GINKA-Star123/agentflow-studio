name: agentflow-studio

services:
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: agentflow-web
    environment:
      NEXT_PUBLIC_APP_NAME: AgentFlow Studio
      API_BASE_URL: http://api:8080
      AI_RUNTIME_BASE_URL: http://ai-runtime:8090
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      ai-runtime:
        condition: service_healthy
    networks:
      - agentflow
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: agentflow-api
    environment:
      APP_ENV: docker
      API_HTTP_PORT: 8080
      DATABASE_URL: postgres://agentflow:agentflow@postgres:5432/agentflow?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:-change-me}
      AI_RUNTIME_URL: http://ai-runtime:8090
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-runtime:
        condition: service_healthy
    networks:
      - agentflow
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/readyz > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai-runtime:
    build:
      context: ../../services/ai-runtime
      dockerfile: Dockerfile
    container_name: agentflow-ai-runtime
    environment:
      APP_ENV: docker
      AI_RUNTIME_HTTP_PORT: 8090
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-https://api.openai.com/v1}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-change-me}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8090:8090"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - agentflow
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/readyz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: agentflow-postgres
    environment:
      POSTGRES_DB: agentflow
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agentflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow -d agentflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agentflow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentflow-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - agentflow
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: agentflow-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - agentflow

  prometheus:
    image: prom/prometheus:latest
    container_name: agentflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - agentflow
    depends_on:
      - api
      - ai-runtime

  grafana:
    image: grafana/grafana:latest
    container_name: agentflow-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - agentflow
    depends_on:
      - prometheus

  nginx:
    image: nginx:1.27-alpine
    container_name: agentflow-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - agentflow

networks:
  agentflow:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  grafana_data: